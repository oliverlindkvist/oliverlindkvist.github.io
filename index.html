<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oliver Lindkvist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <nav class="menu">
      <!-- Title acts as "back to landing page" -->
      <h1 id="site-title">Oliver Lindkvist</h1>
      <ul id="project-list">
        <!-- Loaded dynamically from projects.json -->
      </ul>
    </nav>

    <main class="viewer">
      <img id="main-image" src="./index.JPG" alt="Landing Image" />
    </main>
  </div>

  <script src="script.js"></script>
  <script>
    // Clicking the title restores the landing image
    document.getElementById("site-title").addEventListener("click", () => {
      const mainImage = document.getElementById("main-image");
      if (mainImage) {
        mainImage.src = "./index.JPG";
        mainImage.style.display = "block";
      }

      const video = document.querySelector(".video-container");
      if (video) {
        video.style.display = "none";
      }
    });
  </script>
</body>
</html>
